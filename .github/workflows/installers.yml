name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          chmod +x ./gradlew
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==13.0.0
      - name: Generate installer icons
        run: python scripts/gen_icons.py
      - name: Build RPM
        env:
          LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
          LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          sudo apt-get install -y rpm
          ./gradlew :desktopApp:packageReleaseRpm \
            -Pcrystalist.debug=false -Pcrystalist.verifyPackaging=false \
            --no-daemon --no-configuration-cache
      - name: Collect artifact
        run: |
          mkdir -p out
          version="$(sed -n 's/^appVersion=//p' gradle.properties)"
          rpm="$(find desktopApp/build/compose/binaries/main-release -name '*.rpm' | head -1)"
          test -n "$rpm" || { echo "RPM was not produced" >&2; exit 1; }
          cp "$rpm" "out/CrystaList-linux-x64-${version}.rpm"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: CrystaList-linux-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==13.0.0
      - name: Generate installer icons
        run: python scripts/gen_icons.py
      - name: Build DMG
        env:
          LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
          LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x ./gradlew
          ./gradlew :desktopApp:packageReleaseDmg \
            -Pcrystalist.debug=false \
            -Pcrystalist.verifyPackaging=false \
            --no-daemon --no-configuration-cache
      - name: Collect artifact
        run: |
          mkdir -p out
          version="$(sed -n 's/^appVersion=//p' gradle.properties)"
          arch="$(uname -m)"
          [[ "$arch" == "arm64" ]] && label=arm64 || label=x64
          dmg="$(find desktopApp/build/compose/binaries/main-release -name '*.dmg' | head -1)"
          test -n "$dmg" && cp "$dmg" "out/CrystaList-macos-${label}-${version}.dmg"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: CrystaList-macos
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure WiX Toolset for the .exe installer
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build Windows login helper
        shell: pwsh
        run: |
          dotnet publish metro-wv2-helper/metro-wv2-helper.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output desktopApp/src/desktopMain/resources/windows `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==13.0.0
      - name: Generate installer icons
        shell: bash
        run: python scripts/gen_icons.py
      - name: Build Windows installer
        shell: bash
        env:
          LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
          LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :desktopApp:packageReleaseExe \
            -Pcrystalist.debug=false \
            -Pcrystalist.verifyPackaging=false \
            -Pcrystalist.desktop.arch=x86_64 \
            --no-daemon --no-configuration-cache
      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p out
          version="$(sed -n 's/^appVersion=//p' gradle.properties)"
          exe="$(find desktopApp/build/compose/binaries/main-release -name '*.exe' | head -1)"
          test -n "$exe" && cp "$exe" "out/CrystaList-windows-x64-${version}.exe"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: CrystaList-windows-x64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
